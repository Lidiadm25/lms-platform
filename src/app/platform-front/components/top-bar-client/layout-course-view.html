<div class="w-full min-h-[calc(100vh-4rem)] bg-slate-100">
  <div class="h-20 bg-indigo-500 sticky top-0 z-7 shadow-sm">
    <ul class="h-full flex flex-col-3 items-center justify-center gap-6 align-middle text-white">
      <li [routerLink]="['/course/', this.idProject]" class="hover:cursor-pointer">Course</li>
      <li routerLink="calendar" class="hover:cursor-pointer">Calendar</li>
      <!-- <li>Students</li> -->
      <li routerLink="grades" class="hover:cursor-pointer">Grades</li>
    </ul>
  </div>
  <div class="flex flex-col flex-1">
<!-- 
    <app-breadcrumbs class="ml-20"/> -->

    <div class="flex justify-end pr-15 mb-5 mt-5">
      <button class="btn btn-primary" onclick="complete.showModal()">
        Mark course as complete
      </button>
    </div>

    <div class="px-7 pr-3">
      <router-outlet />
    </div>
  </div>

  <!-- Open the modal using ID.showModal() method -->
  <!-- MODAL VERIFICA-->
  <dialog id="complete" class="modal">
    <div class="modal-box">
      <h3 class="text-lg font-bold">Hello!</h3>
      <p class="py-4">You will no longer be able to access the course.</p>
      <div class="modal-action">
        <form method="dialog">
          <!-- if there is a button in form, it will close the modal -->
          <button class="btn" (click)="courseCompleted()">Mark as completed</button>
          <button class="btn">Close</button>
        </form>
      </div>
    </div>
  </dialog>

  <!-- MODAL CON CUESTIONARIO -->

   <dialog id="surveyModal" class="modal">
    <div class="modal-box">
      <h3 class="text-lg font-bold mb-3">How much did you like the course?</h3>
      @if(needsAnswer()==true){
         <form method="dialog" [formGroup]="this.surveyForm" (ngSubmit)="sendAnswers()" >
      
          @for (question of this.survey()?.questions; track $index) {
            <div
              class="flex flex-col-2 justify-between gap-3 my-2 border border-slate-100 border-round p-3"
            >
              <p>{{ question.title }}</p>
              <app-rating-component
                class="self-center"
                [rating]="''+$index"
                [control]="getControl($index)"
           
              />
            </div>
          }
      <div class="modal-action">      
          <!-- if there is a button in form, it will close the modal -->
          <button class="btn" type="submit">Send answers</button>
          <button class="btn">Close</button>        
      </div>
    </form>
      }
    </div>
  </dialog>
 

  <!-- </div> -->
</div>
