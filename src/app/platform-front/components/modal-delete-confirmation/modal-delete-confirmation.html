<h2 mat-dialog-title>Remove file</h2>
<mat-dialog-content>This will remove the file {{data.name}} from the submission file list.</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="closing()">Cancel</button>
  <!-- The mat-dialog-close directive optionally accepts a value as a result for the dialog. -->
  <button matButton (click)="deleteValue()">Delete</button>
</mat-dialog-actions>
