<!-- Swiper -->
<swiper-container
  [slidesPerView]="3"
  [grid]="{ rows: 2, fill: 'row' }"
  [navigation]="true"
  [spaceBetween]="20"
  [pagination]="{ clickable: true }"
  
>

    @for (item of projects()?.projects; track $index) {
      <swiper-slide>
        <app-project-card [project]="item.project" [in]="this.in()"  class="hover:cursor-pointer" />
      </swiper-slide>
    } @empty {
      <a class="font-bold text-2xl text-center w-full" [routerLink]="['/explore']" > You're not enroll in any course, start now!</a>
    }

</swiper-container>
<div class="swiper-button-prev"></div>
<div class="swiper-button-next"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-element-bundle.min.js"></script>
