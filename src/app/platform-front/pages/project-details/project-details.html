<div class="flex flex-col">
  <!-- HEADER -->
  <div class="bg-indigo-950 h-50 w-full px-15 pt-10">
    <div class="flex flex-col-2 h-full">
      <div class="flex flex-col w-[75%]">
        <p class="text-white font-bold text-xl">{{ this.project()!.title }}</p>
        <!-- <p class="text-white">{{this.project()?.snippet}}</p> -->
        <p class="text-white text-md">
          Created by 
          <span class="text-violet-400 link">{{ this.project()!.author.fullName }}</span>
        </p>
        <p class="text-white text-xs mt-auto pb-3">Last update : {{lastModified.substring(0,10)}}</p>
      </div>
      <div class="size-50 border border-slate-400 bg-white mx-auto">
        <img [src]="this.project()?.image?.url" alt="" />
      </div>
    </div>
  </div>
  <!-- BODY -->
  <div class="px-15 pt-5 flex flex-col-2 justify-between">
    <div class="w-[60%] pb-10">
      <h2 class="my-5">What will you learn? </h2> 

      <div  [innerHTML]="this.project()!.description  | SafeHTML"></div>

      <h2 class="my-5"> Content of the course</h2>
      <app-units-lessons-accordeon [project]="this.project()" class=""/>
    </div>
    
    <div>
      
    <div class="flex flex-col gap-5 mt-20">
      <div class="flex flex-col-2 gap-6 border border-slate-200 rounded-lg p-5 w-80">
      <div class="flex flex-col place-items-center border-r-1 border-slate-200 pr-6">
        <p class="text-xl font-bold">{{this.rating() | number:'1.0-1'}} / 5</p>
        <div class="rating rating-half w-40">
          <div class="mask mask-star mask-half-1 " aria-label="0.5 star" id="0.5"></div>
          <div class="mask mask-star mask-half-2" aria-label="1 star" id="1"></div>
          <div class="mask mask-star mask-half-1 " aria-label="1.5 star" id="1.5"></div>
          <div class="mask mask-star mask-half-2" aria-label="2 star" id="2"></div>
          <div class="mask mask-star mask-half-1 " aria-label="2.5 star" id="2.5"></div>
          <div class="mask mask-star mask-half-2" aria-label="3 star" id="3"></div>
          <div class="mask mask-star mask-half-1 " aria-label="3.5 star" id="3.5"></div>
          <div class="mask mask-star mask-half-2" aria-label="4 star" id="4"></div>
          <div class="mask mask-star mask-half-1 " aria-label="4.5 star" id="4.5"></div>
          <div class="mask mask-star mask-half-2" aria-label="5 star" id="5"></div>
        </div>
      </div>

      <div>
        <p clasS="text-center">Total students</p>
        <p class="font-bold text-center"> {{this.usersNumber()}}</p>
      </div>
    </div>

    <button class="btn btn-primary justify-center" (click)="inscription()"> Start now</button>
    </div>

    </div>
  </div>
</div>
