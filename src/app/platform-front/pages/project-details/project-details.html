<div class="flex flex-col">
  <!-- HEADER -->
  <div class="bg-indigo-950 h-50 w-full px-15 pt-10">
    <div class="flex flex-col-2 h-full">
      <div class="flex flex-col w-[75%]">
        <p class="text-white">{{ this.project()!.title }}</p>
        <p class="text-white">{{this.project()?.snippet}}</p>
        <p class="text-white">
          Created by 
          <span class="text-violet-400 link">{{ this.project()!.author.fullName }}</span>
        </p>
        <p class="text-white text-xs mt-auto pb-3">Last update : {{lastModified.substring(0,10)}}</p>
      </div>
      <div class="size-50 border border-slate-400 bg-white mx-auto">
        <img [src]="this.project()?.image" alt="" />
      </div>
    </div>
  </div>
  <!-- BODY -->
  <div class="px-15 pt-5 flex flex-col-2 justify-between">
    <div class="w-[60%]">
      <h2 class="my-5">What will you learn? </h2> 

      <div [innerHTML]="this.project()!.description"></div>

      <h2 class="my-5"> Content of the course</h2>
      <app-units-lessons-accordeon [project]="this.project()"  />
    </div>
    
    <div>
      
    <div class="flex flex-col gap-5 mt-20">
      <div class="flex flex-col-2 gap-6 border border-slate-200 rounded-lg p-5 w-80">
      <div class="flex flex-col place-items-center border-r-1 border-slate-200 pr-6">
        <p class="text-xl font-bold">4.2</p>
        <div class="rating">
          <div class="mask mask-star" aria-label="1 star"></div>
          <div class="mask mask-star" aria-label="2 star"></div>
          <div class="mask mask-star" aria-label="3 star" aria-current="true"></div>
          <div class="mask mask-star" aria-label="4 star"></div>
          <div class="mask mask-star" aria-label="5 star"></div>
        </div>
      </div>

      <div>
        <p>Total students</p>
        <p class="font-bold text-center"> {{this.usersNumber()}}</p>
      </div>
    </div>

    <button class="btn btn-primary justify-center"> Start now</button>
    </div>

    </div>
  </div>
</div>
