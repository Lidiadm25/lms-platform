
<div class=" bg-white h-full rounded-xl p-7 shadow-sm">
 
    <h2 class="text-2xl mb-10">{{this.project()?.title}}</h2>

    @for (unit of this.project()!.units; track $index) {
      <div class="space-y-6 border border-gray-200 rounded-lg my-2">
      <details class="group [&amp;_summary::-webkit-details-marker]:hidden">
        <summary
          class="flex cursor-pointer items-center justify-between gap-4 bg-white px-4 py-3 font-medium text-gray-900 hover:bg-gray-50 rounded-lg "
        >
          <span>{{unit.title}} </span>

          <svg
            class="size-5 shrink-0 transition-transform duration-300 group-open:-rotate-180"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            ></path>
          </svg>
        </summary>

        @for (item of unit.lessons; track $index) {
          
          <div class="p-4 bg-white px-4 py-3 font-medium text-gray-900 rounded-b-lg flex flex-col-2 ">
           
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"
            />
          </svg>

          <a class="text-gray-700 bg-white ml-5" [routerLink]="['lesson', item.id]">
            {{item.title}}
          </a>
        </div>
        }

      </details>
    </div>
    }
 
</div>
