<h1 class="text-3xl font-bold font-montserrat w-auto">
  All courses
</h1>

<section class="flex flex-col gap-4">
    <input type="string"
    placeholder="Search courses"
    class="mt-3 border border-gray-300 rounded-md p-2"
    [ngModel] = "search()"
    (keydown.enter)="search.set($event.target.value); onSearch()"
    #txtSearch
    />
</section>


<div
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-40"
>
@if(projectResource.isLoading()) {
  <div class="flex items-center gap-2">
      <span class="loading loading-spinner"></span>
      <span>Loading…</span>
    </div>
}

@if(projectResource.error()){
  <div class="alert alert-error">
      <span>Failed to load: {{ projectResource.error()?.message ?? 'Unknown error' }}</span>
     <button class="btn btn-sm ml-auto" (click)="reload()">Retry</button>
    </div>
}
  @for (project of projectResource.value()?.projects; track $index) {
<app-project-card [project]="project" />

  }
  <!-- Empty -->
  @empty {
  <p>No courses</p>
  }
</div>

<app-pagination
  [pages]="projectResource.value()?.pages ?? 0"
  [currentPage]="paginationService.currentPage()"
/>
