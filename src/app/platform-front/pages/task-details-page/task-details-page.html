<div class="bg-sky-50 h-full">
    <div class="breadcrumbs text-sm">
  <ul>
    <li><a>Home</a></li>
    <li><a>Documents</a></li>
    <li>Add Document</li>
  </ul>


  @if(this.task() != null){
  <h1 class="m-6">{{ this.task()!.title }}</h1>
  <div class="flex flex-col m-5  ">
   
     <app-task-info [task] = "this.task()"/>
  
    <!-- MODIFICADO POR COMPONENTE HIJO!! -->
    <p class="m-2">{{this.status()}}</p>
    @if(this.submit()?.date_send != null){
        <!-- TABLA CON DATOS Y CALIFICACIÓN -->

         <app-submit-info/>
    } @else {
      <!-- TODO MAX SIZE-->
        <app-submit-form [submissionId] = "this.submit()!.id" />
    }
  </div>
   }
</div>
