<div class="bg-slate-50 rounded-xl p-7 shadow-sm">
  <h1>{{ this.lesson()?.title }}</h1>

  <div class="ql-editor" [innerHTML]="this.lesson()!.description | SafeHTML"></div>
</div>

@if (this.lesson()?.tasks && this.lesson()!.tasks!.length > 0) {
  <h2 class="my-7">Assigned tasks</h2>
  <div class="outline-2 outline-offset-2 outline-solid outline-sky-700  rounded-xs p-2 overflow-y-auto max-h-100">
    @for (item of this.lesson()!.tasks; track $index) {
    <div class="bg-slate-50 rounded-xl p-7 shadow-sm my-2 flex flex-col-3 gap-3 overflow-y-auto ">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"
        />
      </svg>
      <p>{{ item.title }}</p>
      <a class="flex-1 text-end mr-10 underline md:underline-offset-3 decoration-[0.12rem] hover:cursor-pointer text-blue-700/100" [routerLink]="['/task/', ]"> See task </a>
    </div>
  }
  </div>
  
}
