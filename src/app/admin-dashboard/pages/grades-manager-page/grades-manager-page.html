<h2>GRADE REVIEWS</h2> 

  <app-combobox-units-lesson [projectId]= "this.projectId" (submission)="submitId.set($event)"/>


 <section class="flex flex-col-3 gap-5 justify-between h-full">
  <div class="bg-sky-50 w-1/5 flex-initial">
   <app-list-users [projectId]="this.projectId" (userChosen)="userId.set($event)"/> 
  </div>

  <div class="flex w-3/5 bg-base-100 justify-center items-center " >
    <app-submission-visualizer />
  </div>
  <div class="flex-auto">
    <app-grade-table [userId] = "this.userId()" [submit]="this.userId()"/>
  </div>
</section>
