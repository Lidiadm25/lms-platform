<!-- <app-chart-dashboard/> -->

<div class="p-10">
  <div class="flex flex-row gap-6 overflow-hidden">

    <div class="stats stats-vertical shadow ml-10">
      <div class="stat">
        <div class="stat-title">All time number of students</div>
        <div class="stat-value">{{totalAllTime()}}</div>

      </div>

      <div class="stat">
        <div class="stat-title">Current number of students</div>
        <div class="stat-value">{{this.usersCurrent().length}}</div>
        <div class="stat-desc">↗︎ 400 (22%)</div>
      </div>

      <div class="stat">
        <div class="stat-title"><span class="text-green-500">Online</span> students</div>
        <div class="stat-value">{{this.onlineFiltered()}}</div>
        
      </div>
    </div>
    <div class="flex flex-1 flex-col  rounded-md shadow-md">
        <h2 class="text-center font-light uppercase tracking-widest">Average rating per course</h2>

      <app-chart-dashboard class="w-full" />
    </div>
  </div>
</div>
