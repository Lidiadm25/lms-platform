<form (ngSubmit)="OnSubmit()" [formGroup]="unitForm">
  <label>Title</label>
  <input
    class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
    type="text"
    formControlName="title"
    [class.border-red-500]="unitForm.get('title')?.errors ?? false"
  />

  <label>Description</label> <br />

  <textarea
    class="textarea textarea-bordered"
    placeholder="Descripción"
    rows="6"
    formControlName="description"
    [class.border-red-500]="unitForm.get('description')?.errors ?? false"
  ></textarea>
  <br />

  <button class="btn btn-secondary" type="submit">Save</button>
</form>


@if(this.edit() == true){
  <!-- Open the modal using ID.showModal() method -->
<button class="btn btn-primary" onclick="my_modal_1.showModal()">Delete</button>
<dialog id="my_modal_1" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">Delete unit</h3>
    <p class="py-4">If there's lessons assigned to the unit, they will also be deleted.</p>
    <div class="modal-action">
      <form method="dialog">
         <button class="btn" (click)="deleteUnit()"> Delete</button>
        <button class="btn">Close</button>
      </form>
    </div>
  </div>
</dialog>
}

<h2>LESSONS</h2>
@if(this.unitLoaded()!=null && this.unitLoaded()!.lessons){
   @for (lesson of unitLoaded()!.lessons; track $index) {
              <app-lesson-card [lesson] = "lesson"/>
            }
}@else {
  <h2>No lessons</h2>
}
