<div class="">
  
<div class="flex flex-row justify-between">
  <h2 class="">Unit manager</h2>
  <div class="flex gap-2">
     <button class="btn btn-soft btn-primary" [routerLink]="['/admin/manager/',this.projectId, 'unit', 'create']">New unit</button>
     <button class="btn btn-soft btn-primary"  (click)="verifyStatus()">New lesson</button>
  </div>

</div>
<form (ngSubmit)="OnSubmit()" [formGroup]="unitForm" class="flex flex-col ">
  <div class="flex flex-col gap-2">
    
      <label class="label">Title</label>
     
  <input
    class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
    type="text"
    formControlName="title"
  />

  <label class="label">Description</label> 

  <textarea
  
    [ngClass]="this.edit() ? 'textarea textarea-bordered w-full' : 'textarea textarea-bordered w-full h-70'"
    placeholder="Descripción"
    rows="6"
    formControlName="description"
  ></textarea>
  <br />

  <div [ngClass]="this.edit() ? 'grid sm:grid-cols-2 gap-5' : 'grid grid-cols-1 gap-5'">
   
  @if (this.edit() == true) {
  <!-- Open the modal using ID.showModal() method -->
  <button class="btn btn-primary" onclick="my_modal_1.showModal()">Delete</button>
 
}
 <button class="btn btn-secondary w-full" type="submit">Save</button>
  </div>
 <dialog id="my_modal_1" class="modal">
    <div class="modal-box">
      <h3 class="text-lg font-bold">Delete unit</h3>
      <p class="py-4">If there's lessons assigned to the unit, they will also be deleted.</p>
      <div class="modal-action">
        <form method="dialog">
          <button class="btn" (click)="deleteUnit()">Delete</button>
          <button class="btn">Close</button>
        </form>
      </div>
    </div>
  </dialog>
  </div>
</form>




  @if (wasSaved()) {
    <div class="alert alert-success fixed bottom-4 right-4 w-80 animate-fadeIn">
      <span>Changes saved succesfully</span>
    </div>
  }
  @if (hasError()) {
    <div class="alert alert-error fixed bottom-4 right-4 w-80 animate-fadeIn">
      <span>You shall create an unit first</span>
    </div>
  }





</div>
