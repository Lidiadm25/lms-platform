<!-- TOP BAR -->
<div class="h-20 bg-sky-200 flex flex-col-4 items-center justify-center gap-6 sticky top-0 z-7 ">
  <a [routerLink]="['/admin/manager/', this.projectId]">General</a>
  <a [routerLink]="['/admin/manager/', this.projectId, 'create']">Content</a>
  <!-- change popover-1 and --anchor-1 names. Use unique names for each dropdown -->
  <button
    class="bg-sky-200 transition delay-150 duration-100 ease-in-out hover:bg-sky-100 p-2 rounded-lg"
    popovertarget="popover-3"
    style="anchor-name: --anchor-3"
  >
    Students
  </button>
  <ul
    class="dropdown menu w-52 rounded-box bg-base-100 shadow-sm"
    popover
    id="popover-3"
    style="position-anchor: --anchor-3"
  >
    <li><a onclick="addStudents.showModal()">Add students</a></li>
    <li><a [routerLink]="['/admin/users-project', this.projectId]">Remove students</a></li>
  </ul>
  <a class="bg-sky-200 transition delay-150 duration-100 ease-in-out hover:bg-sky-100 p-2 rounded-lg"
    [routerLink]="['/admin/grades-manager/', this.projectId]">Review grades</a>
</div>

<!-- CONTENT -->
<section class="flex-1 overflow-y-auto p-4">
  <div class=" min-h-full">
  <div class="flex flex-col lg:flex-row gap-6 items-start h-full">
    <app-table-accordeon [idProject]="this.projectId" class="w-full flex-shrink-0 lg:w-80 sticky-top-6"/>

    <main class="flex-1 w-full bg-base-100 rounded-xl shadow-sm p-6 lg:p-8">
      <!-- <div class="flex justify-between items-center mb-8 border-b border-base-200 pb-4"> -->
        <router-outlet/>
      <!-- </div> -->
    </main>
  </div>

  
</div>
</section>
<app-search-tags [projectId]="this.projectId" (onUsersPicked)="usersInscription($event)" />

@if (wasSaved()) {
  <div class="alert alert-success fixed bottom-4 right-4 w-80 animate-fadeIn">
    <span>Users saved succesfully</span>
  </div>
}
@if (hasError()) {
  <div class="alert alert-error fixed bottom-4 right-4 w-80 animate-fadeIn">
    <span>There was an error</span>
  </div>
}
