<div class="flex flex-row justify-between mr-10">
  <h2>Lesson manager</h2>
  <div class="flex gap-2">
    <button class="btn btn-soft btn-primary"  [routerLink]="['/admin/manager/',this.projectId(), this.unitId ,'create']">New lesson</button>
    <button class="btn btn-soft btn-primary" (click)="verifyStatus()">New task</button>
  </div>
</div>
<div class="flex flex-col-3 my-5 ml-10">
  <section class="w-6/6 mr-10">
    <form (ngSubmit)="OnSubmit()" [formGroup]="lessonForm">
      <label class="label">Title</label>
      <input
        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
        type="text"
        formControlName="title"
      />

      <label class="label">Description</label> <br />

      <quill-editor
        formControlName="description"
        class="mb-15 h-40"
        format="html"
        [sanitize]="false"
      >
      </quill-editor>
      <input
        type="file"
        multiple
        class="file-input file-input-bordered w-full mt-4"
        (change)="onFilesChange($event)"
      />
    </form>
    <div class="flex flex-col-2 w-full gap-2 my-4">
      <button class="btn btn-primary flex-1" onclick="my_modal_1.showModal()">Delete</button>
      <dialog id="my_modal_1" class="modal">
        <div class="modal-box">
          <h3 class="text-lg font-bold">Delete lesson</h3>
          <p class="py-4">Are you sure you wanna delete the lesson?</p>
          <div class="modal-action">
            <form method="dialog">
              <button class="btn" (click)="deleteLesson()">Delete</button>
              <button class="btn">Close</button>
            </form>
          </div>
        </div>
      </dialog>
      <button class="btn btn-secondary flex-1" type="submit">Save</button>
    </div>
  </section>
</div>

@if (wasSaved()) {
  <div class="alert alert-success fixed bottom-4 right-4 w-80 animate-fadeIn">
    <span>Changes saved succesfully</span>
  </div>
}
@if (hasError()) {
  <div class="alert alert-error fixed bottom-4 right-4 w-80 animate-fadeIn z-10">
    <span>You shall create a lesson first</span>
  </div>
}
