<div class="flex flex-col-3 my-5 ml-10">
  <app-table-accordeon [idProject]="this.projectId()" />
  <section class="w-6/6 mr-10">
    <form (ngSubmit)="OnSubmit()" [formGroup]="lessonForm">
      <label>Title</label>
      <input
        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
        type="text"
        formControlName="title"
      />

      <label>Description</label> <br />

      <textarea
        class="textarea textarea-bordered"
        placeholder="Descripción"
        rows="6"
        formControlName="description"
      ></textarea>
      <br />
      <input
        type="file"
        multiple
        class="file-input file-input-bordered w-full mt-4"
        (change)="onFilesChange($event)"
      />
      <app-dynamic-size [control]="getSelectedSize()" />

      <button class="btn btn-secondary" type="submit">Save</button>
    </form>

    <button class="btn btn-primary" onclick="my_modal_1.showModal()">Delete</button>
    <dialog id="my_modal_1" class="modal">
      <div class="modal-box">
        <h3 class="text-lg font-bold">Delete lesson</h3>
        <p class="py-4">Are you sure you wanna delete the lesson?</p>
        <div class="modal-action">
          <form method="dialog">
            <button class="btn" (click)="deleteLesson()">Delete</button>
            <button class="btn">Close</button>
          </form>
        </div>
      </div>
    </dialog>

  </section>
  <section class="flex justify-end w-1/9">
    <div class="drawer drawer-end">
      <input id="my-drawer-5" type="checkbox" class="drawer-toggle" />
      <div class="drawer-content">
        <!-- Page content here -->
        <label for="my-drawer-5" class="drawer-button btn btn-primary">See tasks</label>
      </div>
      <div class="drawer-side">
        <label for="my-drawer-5" aria-label="close sidebar" class="drawer-overlay"></label>
        <ul class="menu bg-base-200 min-h-full w-80 p-4">
          <!-- Sidebar content here -->
          @for (item of lessonLoaded()?.tasks; track $index) {
            <li><a > {{item.title}}</a></li>
          } @empty {
            <li>No tasks</li>
          }
          <li><button class="btn btn-primary" (click)="verifyStatus()">Add new task</button></li>
        </ul>
      </div>
    </div>
  </section>
 
</div>
 
    @if (wasSaved()) {
      <div class="alert alert-success fixed bottom-4 right-4 w-80 animate-fadeIn">
        <span>Changes saved succesfully</span>
      </div>
    }
    @if (hasError()) {
      <div class="alert alert-error fixed bottom-4 right-4 w-80 animate-fadeIn z-10">
        <span>You shall create a lesson first</span>
      </div>
    }
