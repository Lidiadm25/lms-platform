<h1 class="text-2xl font-bold">Project manager</h1>
<div class="divider"></div>

<form
  [formGroup]="projectForm"
  class="grid grid-cols-1 sm:grid-cols-2 gap-4"
  (ngSubmit)="onSubmit()"
>

  <!-- Datos generales -->
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-bold h-12">General</h2>
    <input
      type="text"
      class="input input-bordered w-full"
      formControlName="title"
      
      [class.border-red-500]="projectForm.get('title')?.errors ?? false"
    /> 
    <form-error-label [control]="projectForm.get('title')!" /> 

    <textarea
      class="textarea textarea-bordered"
      placeholder="Descripción"
      rows="6"
      formControlName="description"
      [class.border-red-500]="projectForm.get('description')?.errors ?? false"
    ></textarea>

  <form-error-label [control]="projectForm.get('description')!" /> 
   
  </div>
  
  <!-- Imágenes -->
  <div class="flex flex-col gap-2">
      <div class=" mt-2 flex-1">
      <img
        src="https://as2.ftcdn.net/jpg/05/97/47/95/1000_F_597479556_7bbQ7t4Z8k3xbAloHFHVdZIizWK1PdOo.jpg"
        alt="Temporal image"
        class="w-1/2 object-cover rounded-xl"
      />
    
    </div>
     <input
      type="file"
      multiple
      accept="image/*"
      class="file-input file-input-bordered w-full mt-4"
      (change)="onFilesChange($event)"
    />
    <div class="flex justify-end h-12">
      <button class="btn btn-secondary" type="submit">
        <!-- <span class="loading loading-spinner loading-sm"></span> -->

        Guardar
      </button>
    </div>
  </div>
</form>

@if (wasSaved()) {
<div class="alert alert-success fixed bottom-4 right-4 w-80 animate-fadeIn">
  <span>Datos actualizados correctamente</span>
</div>

}
