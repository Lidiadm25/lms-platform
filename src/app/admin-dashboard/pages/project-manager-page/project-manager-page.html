

<form
  [formGroup]="projectForm"
  class="grid grid-cols-1 sm:grid-cols-2 gap-4"
  (ngSubmit)="onSubmit()"
>
  <!-- CUADRO IZQUIERDA-->
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-bold h-12">General</h2>
    <input type="text" class="input input-bordered w-full" formControlName="title" />

    <!-- <textarea
      class="textarea textarea-bordered w-full"
      placeholder="Descripción"
      rows="6"
      formControlName="description"
    ></textarea> -->

    <quill-editor formControlName="description" class="mb-15 h-90">

    </quill-editor >

    

    <button class="btn btn-secondary" type="submit">
      <!-- <span class="loading loading-spinner loading-sm"></span> -->

      save
    </button>

    @if (this.projectLoaded()) {
      <label for="my_modal_6" class="btn btn-primary">Delete</label>

      <!-- TODO: se manda el submit automaticamente!!-->
      <input type="checkbox" id="my_modal_6" class="modal-toggle" />
      <div class="modal" role="dialog">
        <div class="modal-box">
          <h3 class="text-lg font-bold">Delete project</h3>
          <p class="py-4">If there's units assigned to the project, they will also be deleted.</p>
          <div class="modal-action">
            <button class="btn" (click)="deleteProject()">Delete</button>
            <label for="my_modal_6" class="btn">Close</label>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- CUADRO DERECHA -->
  <div class="flex flex-col gap-2">
    <app-image-input [(imageUrl)]="imageUrl" [(file)]="file" />
    <app-category-dropdown [control]="getSelectedControlCategory()" />

    <div class="flex center-items gap-4">
      <Label for="toggle">Status of course</Label>
      <div class="tooltip" data-tip="Students will no longer be able to access the course">
        <input id="toggle" type="checkbox" class="toggle toggle-success" />
      </div>
    </div>
  </div>

<!-- MODAL PARA AGREGAR POR CORREO -->

<app-search-tags [projectId]="this.projectId" (onUsersPicked)="usersInscription($event)" />

@if (wasSaved()) {
  <div class="alert alert-success fixed bottom-4 right-4 w-80 animate-fadeIn">
    <span>Changes saved succesfully</span>
  </div>
}
@if (hasError()) {
  <div class="alert alert-error fixed bottom-4 right-4 w-80 animate-fadeIn">
    <span>You shall create a project first</span>
  </div>
}
