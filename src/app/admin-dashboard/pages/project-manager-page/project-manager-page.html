<h1 class="text-2xl font-bold">Project manager</h1>
<div class="divider"></div>

<form
  [formGroup]="projectForm"
  class="grid grid-cols-1 sm:grid-cols-2 gap-4"
  (ngSubmit)="onSubmit()"
>
  <!-- CUADRO IZQUIERDA-->
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-bold h-12">General</h2>
    <input
      type="text"
      class="input input-bordered w-full"
      formControlName="title"
      
    />

    <textarea
      class="textarea textarea-bordered"
      placeholder="Descripción"
      rows="6"
      formControlName="description"
      
    ></textarea>

    <app-category-dropdown [control] = "getSelectedControlCategory()"/>

    <div class="flex center-items gap-4">
      <Label for="toggle">Status of course</Label>
      <div class="tooltip" data-tip="Students will no longer be able to access the course">
        <input id="toggle" type="checkbox" class="toggle toggle-success" />
      </div>
    </div>

    <button class="btn btn-secondary" type="submit">
      <!-- <span class="loading loading-spinner loading-sm"></span> -->

      save
    </button>

    @if (this.projectLoaded()) {
      <button class="btn btn-primary" onclick="my_modal_2.showModal()">Delete</button>
      <dialog id="my_modal_2" class="modal">
        <div class="modal-box">
          <h3 class="text-lg font-bold">Delete unit</h3>
          <p class="py-4">If there's lessons assigned to the unit, they will also be deleted.</p>
          <div class="modal-action">
            <form method="dialog">
              <button class="btn" (click)="deleteProject()">Delete</button>
              <button class="btn">Close</button>
            </form>
          </div>
        </div>
      </dialog>
    }
  </div>

  <!-- CUADRO DERECHA -->
  <div class="flex flex-col gap-2">
    <app-image-input [(imageUrl)]="imageUrl" [(file)]="file" />
  </div>

  <div class="flex flex-col gap-2">
    <div class="flex center-items gap-4">
      <h2 class="text-2xl font-bold h-12">Manage students</h2>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
        />
      </svg>
    </div>

    <!-- <div class="card bg-base-100 w-full shadow-sm">
      <a [routerLink]="['/admin/users-project', projectId]">
        <div class="card-body">
        <h2 class="card-title">See all students</h2>
      </div>
      </a>
    </div> -->

    <div class="card bg-base-100 w-full shadow-sm">
      <div class="card-body" onclick="my_modal_1.showModal()">
        <h2 class="card-title">Add new students</h2>
      </div>
    </div>

    <div class="card bg-base-100 w-full shadow-sm">
      <div class="card-body">
        <h2 class="card-title">Remove students</h2>
      </div>
    </div>
  </div>
  <!-- LIST OF UNITS OF THE PROJECT CUADRO BOTTOM RIGHT-->
   <div class="flex flex-col gap-2">
   <a
    class="flex flex-col-2 gap-3"
    [routerLink]="['/admin/units-manager', this.projectId, 'create']"
  >
    <h2 class="text-2xl font-bold h-12">Units</h2>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="size-6"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
      />
    </svg>
  </a>
  @if (this.projectLoaded()) {
    <app-units-list [units]="this.projectLoaded()!.units" [projectId]="this.projectLoaded()!.id" />
  }
</div>
  <!-- Management of students -->
</form>

<!-- MODAL PARA AGREGAR POR CORREO -->

<app-search-tags [projectId]="this.projectId" (onUsersPicked)="usersInscription($event)" />

@if (wasSaved()) {
  <div class="alert alert-success fixed bottom-4 right-4 w-80 animate-fadeIn">
    <span>Changes saved succesfully</span>
  </div>
}
