<div class="p-10 bg-base-100 max-h-screen min-h-[calc(100vh-4rem)]"
>

  @if (projectResource.error()) {
    <h3>ERROR:</h3>
    <h3>{{ projectResource.error() }}</h3>
  } @else if (projectResource.isLoading()) {
    <div class="flex justify-center items-center h-screen">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  } @else if (projectResource.hasValue()) {
    <p class="text-4xl font-bold">My courses</p>
    <div class="flex justify-end">
      <button class="btn btn-soft btn-primary place-self-end " routerLink="/admin/manager/create">New course</button>
    </div>
    <app-project-list [projects]="projectResource.value()" />
  } @else {
    <p>Start now!</p>
  }

 <div class=" flex justify-center my-10">
   <app-pagination
    [pages]="projectResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  />
 </div>
</div>
