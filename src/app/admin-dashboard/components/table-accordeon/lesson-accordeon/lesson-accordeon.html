<li>
  @if (lesson()?.tasks && lesson()!.tasks.length > 0) {
    <details open>
      <summary>
        <span (dblclick)="navigateLesson()"> {{ lesson()?.title }}</span>
      </summary>

      <ul>
        @for (task of lesson()?.tasks; track $index) {
          <li>
            <span (click)="navigateTask(task.id)">{{ task.title }}</span>
          </li>
        }
      </ul>
    </details>
  } @else {
    <span (click)="navigateLesson()">{{ lesson()?.title }}</span>
  }
</li>
