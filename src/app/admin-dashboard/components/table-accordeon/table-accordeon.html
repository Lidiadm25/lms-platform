 <section class="w-1/6 flex items-center justify-center flex-col gap-5">
    <h2>Units</h2>

@if (this.projectLoaded()) {
    <table>
        @for (item of projectLoaded()!.units; track $index) {
      <th (click)="navigateUnits(item.id)">{{item.title}}</th>
      @for (lesson of item.lessons; track $index) {
      <tr>
        <td (click)="navigateLesson(item.id,lesson.id)">{{lesson.title}}</td>
      </tr>
      }
      }
      
</table>
} @else {
  <h2>No units</h2>
}


  </section>
