
@if (this.projectLoaded()) {
<ul class="menu bg-base-100 rounded-xl shadow-sm w-full text-base-content">

  @for (unit of this.projectLoaded()?.units; track $index) {
    <li>
      @if (unit?.lessons && unit.lessons.length > 0) {
        <details open>
          <summary>
            <span (dblclick)="navigateUnits(unit.id)">{{ unit.title }}</span>
          </summary>

          <ul>
            @for (lesson of unit.lessons; track $index) {
             <app-lesson-accordeon [lessonId] ="lesson.id" [unitId]="unit.id" [projectId]="this.projectLoaded()!.id" />
            }
          </ul>
        </details>
      } @else {
        <span (click)="navigateUnits(unit.id)">{{ unit.title }}</span>
      }
    </li>
  }

</ul>
}
