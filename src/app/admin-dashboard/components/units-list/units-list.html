<div class="flex flex-col gap-2">
<div class="flex flex-col-2 gap-3">
  <a [routerLink]="['/admin/units-manager',this.projectId() ,'create' ]">
    <h2 class="text-2xl font-bold h-12">Units</h2>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="1.5"
    stroke="currentColor"
    class="size-6"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
    />
  </svg>
  </a>
</div>

  @for (item of units(); track $index) {
    <div class="join join-vertical bg-base-100">
      <app-unit-card [unit]="item" />
    </div>
  } @empty {
    <p>No units</p>
  }
</div>
