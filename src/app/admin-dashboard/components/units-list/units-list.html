<div class="flex flex-col gap-2">
    <h2 class="text-2xl font-bold h-12">Units</h2>

        @for (item of units(); track $index) {
      <div class="join join-vertical bg-base-100">
        <app-unit-card [unit] = "item"/>
      </div>
    } 
    @empty {
        <p>No units</p>
    }
    

  </div>
