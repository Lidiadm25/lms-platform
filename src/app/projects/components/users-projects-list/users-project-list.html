<section class="p-7">
  <table class="table table-md mt-2 w-full text-center">
    <thead>
      <tr>
        <th>Email of student</th>
        <th>Full name</th>
        <th>Project</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (user of users().users; track user.id; let index = $index) {
        <tr>
          <td>{{ user.user.email }}</td>
          <td>{{ user.user.fullName }}</td>
          <td>{{ user.project.title }}</td>
          <td>
            <svg
             xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                strokeLinecap="round"
                strokeLinejoin="round"
                d="m12.75 15 3-3m0 0-3-3m3 3h-7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>
          </td>
         
        </tr>
      }
    </tbody>
  </table>

  
</section>
