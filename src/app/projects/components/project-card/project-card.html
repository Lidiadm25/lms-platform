<div
  class="bg-base-100 shadow-sm rounded-lg flex flex-col  h-80"
  (click)="navigateToPage()"
>

  <img
    class="w-full h-40 object-cover rounded-lg bg-red-200"
    [src]="imageUrl()"
  />

  <div class="p-5 flex flex-col min-w-0">
    
    <h2 class="truncate">
      {{ project().title }}
    </h2>

    <div
      class="truncate"
      [innerHTML]="project().description"
    ></div>

    <p>
      {{ project().duration }}
    </p>


  </div>
</div>
