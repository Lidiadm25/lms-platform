<div class="navbar bg-base-100 ">
  <div class="navbar-start">
  
    <a [routerLink]="['/', home()]" class="btn btn-ghost text-xl font-montserrat">
      Innova
      <span class="text-primary">| earn</span>
    </a>
  
  </div>
  <div class="navbar-center hidden lg:flex">
    <ul class="menu menu-horizontal px-1">
      @if (authService._role() == 'user') {
        <li>
          <a
            routerLink="category/Software development"
            class="btn btn-ghost"
            routerLinkActive="text-secondary"
          >
            Software development
          </a>
        </li>

        <li>
          <a
            routerLink="category/Web Development"
            class="btn btn-ghost"
            routerLinkActive="text-secondary"
          >
            Web development
          </a>
        </li>
        <li>
          <a
            routerLink="category/Mobile development"
            class="btn btn-ghost"
            routerLinkActive="text-secondary"
          >
            Mobile development
          </a>
        </li>
      }
    </ul>
  </div>
  <div class="navbar-end gap-4 mr-4">
    <button class="btn btn-ghost" routerLink="home"> My courses</button>
    <button class="btn btn-ghost btn-circle">
      <div class="indicator">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
          />
        </svg>
        <span class="badge badge-xs badge-primary indicator-item"></span>
      </div>
    </button>
    <button class="btn btn-ghost btn-circle">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.9"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
        />
      </svg>
    </button>
  </div>
</div>
