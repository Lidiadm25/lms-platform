<div class="mt-4">
  <form (ngSubmit)="OnSubmit()" [formGroup]="loginForm" autocomplete="on">
    <label class="block text-gray-700 text-sm font-bold mb-2">Email address</label>
    <input
      class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
      type="email"
      formControlName="email"
    />
    <!-- @if (formUtils.isValidField(loginForm, 'email')) {
      <span class="form-text text-danger">
        {{ formUtils.getFieldError(loginForm, 'email') }}
      </span>
    } -->
    <div class="mt-4">
      <div class="flex justify-between">
        <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
        <a href="#" class="text-xs text-gray-500">Forget Password?</a>
      </div>
      <input
        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
        type="password"
        formControlName="password"
      />
      <!-- @if ( formUtils.isValidField( loginForm, 'name') ) {
          <span class="form-text text-danger">
            {{ formUtils.getFieldError(loginForm, "name") }}
          </span>
          } -->
      <a routerLink="/auth/register" class="text-s text-gray-500"
        >Don't have and account yet?<span class="text-blue-500"> Sign up</span></a
      >
    </div>
    <div class="mt-8">
      <button class="bg-gray-700 text-white font-bold py-2 px-4 w-full rounded hover:bg-gray-600">
        Login
      </button>
    </div>
    <div class="mt-4 flex items-center justify-between">
      <span class="border-b w-1/5 md:w-1/4"></span>
      <a href="#" class="text-xs text-gray-500 uppercase">or sign up</a>
      <span class="border-b w-1/5 md:w-1/4"></span>
    </div>
    <a
      href="#"
      class="flex items-center justify-center mt-4 text-white rounded-lg shadow-md hover:bg-gray-100"
    >
      <div class="px-4 py-3">
        <svg class="h-6 w-6" viewBox="0 0 40 40">
          <path
            d="M36.3425 16.7358H35V16.6667H20V23.3333H29.4192C28.045 27.2142 24.3525 30 20 30C14.4775 30 10 25.5225 10 20C10 14.4775 14.4775 9.99999 20 9.99999C22.5492 9.99999 24.8683 10.9617 26.6342 12.5325L31.3483 7.81833C28.3717 5.04416 24.39 3.33333 20 3.33333C10.7958 3.33333 3.33335 10.7958 3.33335 20C3.33335 29.2042 10.7958 36.6667 20 36.6667C29.2042 36.6667 36.6667 29.2042 36.6667 20C36.6667 18.8825 36.5517 17.7917 36.3425 16.7358Z"
            fill="#FFC107"
          />
          <path
            d="M5.25497 12.2425L10.7308 16.2583C12.2125 12.59 15.8008 9.99999 20 9.99999C22.5491 9.99999 24.8683 10.9617 26.6341 12.5325L31.3483 7.81833C28.3716 5.04416 24.39 3.33333 20 3.33333C13.5983 3.33333 8.04663 6.94749 5.25497 12.2425Z"
            fill="#FF3D00"
          />
          <path
            d="M20 36.6667C24.305 36.6667 28.2167 35.0192 31.1742 32.34L26.0159 27.975C24.3425 29.2425 22.2625 30 20 30C15.665 30 11.9842 27.2359 10.5975 23.3784L5.16254 27.5659C7.92087 32.9634 13.5225 36.6667 20 36.6667Z"
            fill="#4CAF50"
          />
          <path
            d="M36.3425 16.7358H35V16.6667H20V23.3333H29.4192C28.7592 25.1975 27.56 26.805 26.0133 27.9758C26.0142 27.975 26.015 27.975 26.0158 27.9742L31.1742 32.3392C30.8092 32.6708 36.6667 28.3333 36.6667 20C36.6667 18.8825 36.5517 17.7917 36.3425 16.7358Z"
            fill="#1976D2"
          />
        </svg>
      </div>
      <h1 class="px-4 py-3 w-5/6 text-center text-gray-600 font-bold">Sign in with Google</h1>
    </a>
  </form>
  @if (hasError()) {
    <div role="alert" class="alert alert-error animate-fadeIn fixed bottom-5 right-5 w-52">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 shrink-0 stroke-current"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      <span>Por favor revise la información ingresada.</span>
    </div>
  }
</div>
